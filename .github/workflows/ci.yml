name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and route tests
        run: npm test

      # Existing lint errors are tracked in docs/PRODUCTION_ROADMAP.md (task 4.6).
      # Remove continue-on-error once they are fixed so lint becomes blocking.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
