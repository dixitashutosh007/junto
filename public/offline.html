<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#059669" />
    <title>Offline · Junto</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f1f5f9; color: #0f172a; }
      main { max-width: 22rem; margin: 1rem; padding: 2rem 1.5rem; text-align: center; background: #fff;
        border: 1px solid #e2e8f0; border-radius: 1.5rem; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08); }
      h1 { font-size: 1.125rem; margin: 0.75rem 0 0.5rem; }
      p { font-size: 0.8125rem; line-height: 1.5; color: #475569; margin: 0 0 1.25rem; }
      button { font: inherit; font-size: 0.8125rem; font-weight: 600; color: #fff; background: #047857;
        border: 0; border-radius: 0.75rem; padding: 0.7rem 1.4rem; cursor: pointer; }
      button:focus-visible { outline: 3px solid #0f172a; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" width="56" height="56" alt="" />
      <h1>You're offline</h1>
      <p>Junto needs an internet connection to show rides and requests. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
